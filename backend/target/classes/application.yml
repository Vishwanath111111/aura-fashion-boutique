server:
  port: ${PORT:8081}
  servlet:
    context-path: /

spring:
  application:
    name: aura-boutique-backend
  datasource:
    url: jdbc:h2:mem:auradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    com.aura.boutique: DEBUG
